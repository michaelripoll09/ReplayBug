name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: replaybug
          POSTGRES_PASSWORD: replaybug
          POSTGRES_DB: replaybug
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U replaybug -d replaybug"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REPLAYBUG_DATABASE_URL: postgres://replaybug:replaybug@localhost:5544/replaybug
      # Hermetic Block 7 artifact storage: per-run temp FS dirs (no paid
      # service, no S3, no external map server). Suites that need storage
      # inject their own temp dirs; this keeps any shared-contract default
      # (LocalArtifactStorage.fromEnv) off the runner home directory.
      REPLAYBUG_ARTIFACT_DIR: ${{ runner.temp }}/replaybug-artifacts-test
      REPLAYBUG_ARTIFACT_STAGING_DIR: ${{ runner.temp }}/replaybug-artifacts-staging-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Covers unit tests plus real-PostgreSQL integration suites:
      # migrations (packages/db), ingest (apps/api) and the worker pipeline
      # (apps/worker: pg-boss startup, outbox dispatch, event processing,
      # issue grouping, concurrency, regression, retries, poison jobs).
      # Block 7 suites run inside the same gate (real PG + real FS temp
      # dirs): secret-token security matrix + log-leak capture (apps/api),
      # CLI integration incl. the built binary (packages/cli), release API
      # + preflight/upload/traversal/MIME/limit/hash/compensation
      # (apps/api artifact + CLI routes), source-map unit + column +
      # sourceMappingURL SSRF suites and worker symbolication A-F +
      # mapped-fingerprint cross-release integration (apps/worker),
      # storage-outage degradation (apps/api), and the minified demo
      # scenario unit tests (apps/demo).
      - run: pnpm test

  openapi-drift:
    name: openapi-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # api:generate prepares its own workspace build closure (Turbo ^build),
      # so this is safe on a clean checkout with no prebuilt dist/.
      - run: pnpm api:check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: e2e (playwright chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: replaybug
          POSTGRES_PASSWORD: replaybug
          POSTGRES_DB: replaybug
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U replaybug -d replaybug"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REPLAYBUG_DATABASE_URL: postgres://replaybug:replaybug@localhost:5544/replaybug
      REPLAYBUG_AUTH_SECRET: test-secret-0123456789abcdef0123456789
      REPLAYBUG_WEB_URL: http://localhost:3000
      REPLAYBUG_API_URL: http://localhost:4001
      REPLAYBUG_TRUSTED_ORIGINS: http://localhost:3000
      REPLAYBUG_USER_HMAC_SECRET: test-hmac-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_REPLAYBUG_API_URL: http://localhost:4001
      # Per-run temp artifact root for the E2E API server (mirrors the
      # Playwright webServer default; keeps CI hermetic and off any shared
      # directory). The minified source-map full-flow specs
      # (releases-sourcemaps, sourcemaps-full-flow) spawn their worker
      # against the same root.
      REPLAYBUG_ARTIFACT_DIR: ${{ runner.temp }}/replaybug-artifacts-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm --filter @replaybug/web exec playwright install --with-deps chromium
      - run: pnpm --filter @replaybug/demo exec playwright install --with-deps chromium
      # Web E2E includes the Block 7 release/token UI specs and the
      # minified source-map full flow (CLI create/upload → minified
      # browser error → worker symbolication → mapped issue, cross-release
      # grouping, missing-map and revoked-token degradation). Demo E2E
      # covers Blocks 3-5 ingest/privacy/worker flows (kept green).
      - run: pnpm --filter @replaybug/web test:e2e
      - run: pnpm --filter @replaybug/demo test:e2e

  sdk-size:
    name: sdk-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sdk:size
